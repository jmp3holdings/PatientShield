<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatientShield | Secure Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <!-- Login Screen -->
    <div id="loginScreen" class="max-w-md mx-auto mt-24 bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
        <h2 class="text-2xl font-bold mb-2 text-slate-800">Admin Portal Login</h2>
        <p class="text-sm text-slate-500 mb-6">Enter your secure password to access client audit records.</p>

        <form id="loginForm" class="space-y-4">
            <input type="password" id="adminPassword" placeholder="Admin Password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition cursor-pointer">Login to Dashboard</button>
        </form>

        <div class="mt-4 text-center">
            <button type="button" onclick="forgotPassword()" class="text-xs text-blue-600 hover:underline font-semibold cursor-pointer">Forgot Password? The owner resets it in the Vercel environment settings</button>
        </div>
        <p id="msg" class="text-xs text-center mt-3 text-slate-500"></p>
    </div>

    <!-- Dashboard Container (Guaranteed hidden by default via inline style) -->
    <div id="dashboard" style="display: none;" class="max-w-7xl mx-auto px-6 py-10">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">PatientShield Admin Dashboard</h1>
                <p class="text-sm text-slate-500">Manage client intakes, review AI forensic findings, approve dispute letters, and dispatch emails.</p>
            </div>
            <button onclick="loadLeads()" class="bg-white border border-slate-300 hover:bg-slate-50 px-4 py-2 rounded-lg text-sm font-semibold text-slate-700 shadow-sm cursor-pointer">Refresh Leads</button>
        </div>

        <div id="leadsContainer" class="space-y-6">
            <!-- Dynamic leads populated here -->
        </div>
    </div>

    <script>
        function adminAuthHeaders() {
            return { 'Authorization': 'Bearer ' + (sessionStorage.getItem('adminPassword') || '') };
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('msg');

            btn.textContent = 'Verifying...';
            msg.textContent = '';

            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    sessionStorage.setItem('adminPassword', password);
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadLeads();
                } else {
                    msg.textContent = data.message || 'Login failed.';
                    msg.className = 'text-xs text-center mt-3 text-red-600';
                }
            } catch (err) {
                msg.textContent = 'Connection error during login.';
                msg.className = 'text-xs text-center mt-3 text-red-600';
            } finally {
                btn.textContent = 'Login to Dashboard';
            }
        });

        async function forgotPassword() {
            const email = prompt('Enter your admin email for password reset instructions:');
            if (!email) return;
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                alert(data.message || 'If that email is on file, reset instructions have been sent.');
            } catch (err) {
                alert('Connection error during password reset.');
            }
        }

        function openFile(fileData) {
            const win = window.open('', '_blank');
            win.document.write('<iframe src="' + fileData + '" style="width:100%;height:100vh;border:none;"></iframe>');
        }

        async function approveLead(leadId) {
            if (!confirm('Are you sure you want to approve this dispute letter and send the email to the client?')) return;
            try {
                const response = await fetch('/api/approve-lead', {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, adminAuthHeaders()),
                    body: JSON.stringify({ leadId: leadId })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert(result.message);
                    loadLeads();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                alert('Connection error while approving lead.');
                console.error(err);
            }
        }

        async function recordOutcome(leadId) {
            const reduced = document.getElementById('reduced-' + leadId).value;
            const ref = document.getElementById('ref-' + leadId).value.trim();
            if (reduced === '' || !ref) { alert('Enter the reduced balance and the written confirmation reference.'); return; }
            if (!confirm('Record this outcome? This computes the verified savings and fee, and sends the Stripe invoice when configured.')) return;
            try {
                const response = await fetch('/api/record-outcome', {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, adminAuthHeaders()),
                    body: JSON.stringify({ leadId: leadId, reducedBalance: Number(reduced), confirmationRef: ref })
                });
                const result = await response.json();
                if (result.status === 'success') { alert(result.message); loadLeads(); }
                else { alert('Error: ' + result.message); }
            } catch (err) { alert('Connection error while recording the outcome.'); console.error(err); }
        }

        async function sendDispute(leadId) {
            const email = document.getElementById('hospemail-' + leadId).value.trim();
            if (!confirm('Send the dispute packet to the hospital billing department now?')) return;
            try {
                const response = await fetch('/api/send-dispute', {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, adminAuthHeaders()),
                    body: JSON.stringify({ leadId: leadId, hospitalEmail: email || undefined })
                });
                const result = await response.json();
                if (result.status === 'success') { alert(result.message); loadLeads(); }
                else { alert('Error: ' + result.message); }
            } catch (err) { alert('Connection error while sending the dispute.'); console.error(err); }
        }

        async function loadLeads() {
            const container = document.getElementById('leadsContainer');
            container.innerHTML = '<div class="text-center py-10 text-slate-500">Loading leads...</div>';

            try {
                const response = await fetch('/api/admin-leads', {
                    headers: adminAuthHeaders()
                });
                const data = await response.json();

                if (!response.ok) {
                    container.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl">Error: ' + (data.message || 'Could not load leads.') + '</div>';
                    return;
                }

                if (data.status === 'success' && data.leads && data.leads.length > 0) {
                    container.innerHTML = data.leads.map(lead => {
                        const isApproved = lead.emailSentAt ? true : false;
                        const emailContent = lead.emailContent || { subject: '', recipient: '' };

                        return `
                                <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-6 space-y-4">
                                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-100 pb-4 gap-4">
                                        <div>
                                            <div class="flex items-center gap-2">
                                                <h3 class="text-xl font-bold text-slate-800">${lead.fullName}</h3>
                                                <span class="text-xs px-2.5 py-1 rounded-full font-bold ${isApproved ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                                    ${isApproved ? '✓ Email Sent' : '⏳ Pending Admin Approval'}
                                                </span>
                                            </div>
                                            <p class="text-sm text-slate-500 mt-1">Hospital: ${lead.hospitalName} · Email: ${lead.clientEmail} · Phone: ${lead.phone}</p>
                                            <p class="text-xs text-slate-400 mt-1">Submitted: ${new Date(lead.createdAt).toLocaleString()} · ID: ${lead.id}</p>
                                        </div>
                                        <div class="flex gap-4 items-center">
                                            <div class="text-right">
                                                <span class="block text-xs text-slate-500 font-semibold">Extracted Bill Total</span>
                                                <span class="block text-lg font-bold text-slate-800">${lead.extractedBillAmount || '$0'}</span>
                                            </div>
                                            <div class="text-right bg-emerald-50 border border-emerald-100 rounded-xl px-3 py-1.5">
                                                <span class="block text-xs text-emerald-700 font-semibold">Potential Savings</span>
                                                <span class="block text-lg font-bold text-emerald-700">${lead.estimatedSavings || '$0.00'}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="grid md:grid-cols-2 gap-6">
                                        <div>
                                            <p class="font-semibold text-slate-700 text-sm mb-2">Uploaded Documents (Patient Evidence):</p>
                                            <p class="text-slate-600 flex items-center justify-between gap-2 mb-2">
                                                <span>• Bill: ${lead.fileName}</span>
                                                ${lead.fileData ? `<button onclick="openFile('${lead.fileData}')" class="bg-blue-600 text-white text-xs px-3 py-1 rounded-lg hover:bg-blue-700 font-semibold cursor-pointer shadow-sm">View File</button>` : ''}
                                            </p>
                                            <p class="text-slate-600 mb-2">• EOB: ${lead.eobName}</p>
                                            <p class="text-slate-600 mb-3">• Records: ${lead.recordsName}</p>

                                            ${lead.missingInfoRequests && lead.missingInfoRequests.length > 0 ? `
                                            <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">
                                                <p class="font-bold mb-1">⚠️ Missing Information Requested from Client:</p>
                                                <ul class="list-disc pl-4 space-y-0.5">
                                                    ${lead.missingInfoRequests.map(req => `<li>${req}</li>`).join('')}
                                                </ul>
                                            </div>
                                            ` : ''}
                                        </div>
                                        <div>
                                            <p class="font-semibold text-slate-700 text-sm mb-2">AI Forensic Findings (CPT/HCPCS & Duplicate Detection):</p>
                                            ${lead.analysisFindings && lead.analysisFindings.length > 0 ? lead.analysisFindings.map(f => `<p class="text-slate-600 text-xs mb-1.5">• <strong>${f.category}:</strong> ${f.description}</p>`).join('') : '<p class="text-slate-500 text-xs italic">No verified billing discrepancies or duplicate entries identified yet.</p>'}
                                        </div>
                                    </div>

                                    <div>
                                        <h4 class="font-semibold text-slate-700 text-sm mb-2">Generated Hospital Dispute Letter Draft (with Verification References):</h4>
                                        <div class="bg-slate-900 text-slate-100 p-4 rounded-xl text-xs whitespace-pre-wrap font-mono max-h-64 overflow-y-auto">${lead.disputeLetterDraft || 'Draft pending.'}</div>
                                    </div>

                                <div class="border-t border-slate-100 pt-4">
                                    <p class="font-semibold text-slate-700 text-sm mb-1">Case Pipeline</p>
                                    <p class="text-xs text-slate-600">State: <strong>${lead.caseState || 'legacy (pre-pipeline)'}</strong>${lead.agreement ? ' · Agreement: ✓ v' + lead.agreement.version + ' (' + new Date(lead.agreement.acceptedAt).toLocaleString() + ')' : ' · Agreement: ✗ none on file'}${lead.hospitalBillingEmail ? ' · Hospital billing email: ' + lead.hospitalBillingEmail : ''}</p>
                                    ${lead.disputeSentAt ? `<p class="text-xs text-emerald-600 font-semibold mt-1">✓ Dispute sent ${new Date(lead.disputeSentAt).toLocaleString()} to ${lead.disputeSentTo} (${lead.disputeChannel})</p>` : ''}
                                    ${lead.outcome ? `<p class="text-xs text-slate-700 mt-1">Outcome: <strong>${lead.outcome.result}</strong> — $${lead.outcome.originalBalance} → $${lead.outcome.reducedBalance} · Verified savings $${lead.outcome.verifiedSavings} · Fee $${lead.outcome.fee} · Ref: ${lead.outcome.confirmationRef}${lead.feeInvoice ? ' · Invoice: ' + lead.feeInvoice.invoiceStatus + (lead.feeInvoice.hostedInvoiceUrl ? ' (' + lead.feeInvoice.hostedInvoiceUrl + ')' : '') : ''}</p>` : `
                                    <div class="grid md:grid-cols-2 gap-3 mt-3">
                                        <div class="flex flex-col gap-2">
                                            <input type="email" id="hospemail-${lead.id}" placeholder="Hospital billing email" value="${lead.hospitalBillingEmail || ''}" class="border border-slate-300 rounded-lg px-3 py-2 text-xs">
                                            <button onclick="sendDispute('${lead.id}')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition cursor-pointer">Send Dispute Packet to Hospital</button>
                                        </div>
                                        <div class="flex flex-col gap-2">
                                            <input type="number" step="0.01" min="0" id="reduced-${lead.id}" placeholder="Reduced balance (from written confirmation)" class="border border-slate-300 rounded-lg px-3 py-2 text-xs">
                                            <input type="text" id="ref-${lead.id}" placeholder="Confirmation reference (e.g. corrected statement date)" class="border border-slate-300 rounded-lg px-3 py-2 text-xs">
                                            <button onclick="recordOutcome('${lead.id}')" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition cursor-pointer">Record Outcome & Invoice Fee</button>
                                        </div>
                                    </div>`}
                                </div>

                                <div class="border-t border-slate-100 pt-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div class="text-xs text-slate-600">
                                            <p class="font-semibold text-slate-700 mb-1">Prepared Client Email Status:</p>
                                            <p><strong>Subject:</strong> ${emailContent.subject || 'N/A'}</p>
                                            <p><strong>Recipient:</strong> ${emailContent.recipient || lead.clientEmail}</p>
                                            ${isApproved ? `<p class="text-emerald-600 font-semibold mt-1">✓ Dispatched at: ${new Date(lead.emailSentAt).toLocaleString()}</p>` : ''}
                                        </div>
                                        <div>
                                            ${isApproved
                                                ? `<span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1.5 rounded-full font-bold">Email Already Sent</span>`
                                                : `<button onclick="approveLead('${lead.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition cursor-pointer">Approve & Send Email to Client</button>`
                                            }
                                        </div>
                                    </div>
                                </div>
                            `;
                    }).join('');
                } else {
                    container.innerHTML = `<div class="bg-white rounded-2xl shadow-md border p-6 text-center text-slate-500">No client audit records found yet.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl">Error loading leads from database.</div>`;
            }
        }
    </script>
</body>
</html>
